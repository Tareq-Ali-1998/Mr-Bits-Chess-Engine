<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc">
<title id="title">The actual Small and Large chess evaluation networks</title>
<desc id="desc">Both networks accept 782 visible-state features and output one White-perspective pawn score. Small has two hidden layers. Large has an initial projection, eight residual blocks, a hidden head, and a linear output.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="590" rx="24" fill="#f8fafc"/>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
<text x="540" y="42" fill="#0f172a" font-size="27" font-weight="700">One position → one learned chess score</text>
<text x="540" y="71" fill="#475569" font-size="16">The source code and trained checkpoints agree on these architectures.</text>
<g fill="#dbeafe" stroke="#93c5fd"><rect x="26" y="120" width="166" height="90" rx="12"/><rect x="246" y="120" width="166" height="90" rx="12"/><rect x="466" y="120" width="166" height="90" rx="12"/><rect x="696" y="120" width="320" height="90" rx="12"/></g>
<g fill="#1e3a8a" font-size="20" font-weight="600"><text x="109" y="155">782 inputs</text><text x="329" y="155">256 units</text><text x="549" y="155">64 units</text><text x="856" y="155">1 signed score</text></g>
<g fill="#334155" font-size="15"><text x="109" y="184">binary features</text><text x="329" y="184">Linear → ReLU</text><text x="549" y="184">Linear → ReLU</text><text x="856" y="184">Linear; White pawn units</text></g>
<g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M192 165 H234"/><path d="M412 165 H454"/><path d="M632 165 H684"/></g>
<text x="540" y="246" fill="#1d4ed8" font-size="19" font-weight="700">SMALL · 216,961 parameters · 3 Linear layers</text>
<g fill="#ede9fe" stroke="#c4b5fd"><rect x="26" y="302" width="166" height="104" rx="12"/><rect x="236" y="302" width="190" height="104" rx="12"/><rect x="470" y="302" width="238" height="104" rx="12"/><rect x="752" y="302" width="120" height="104" rx="12"/><rect x="916" y="302" width="138" height="104" rx="12"/></g>
<g fill="#5b21b6" font-size="19" font-weight="600"><text x="109" y="336">782 inputs</text><text x="331" y="336">1024 units</text><text x="589" y="336">8 residual blocks</text><text x="812" y="336">256</text><text x="985" y="336">1 score</text></g>
<g fill="#334155" font-size="14"><text x="109" y="368">same features</text><text x="331" y="368">Linear → ReLU</text><text x="589" y="363">each: 1024 → 1024 → 1024</text><text x="589" y="387">with a skip connection</text><text x="812" y="368">ReLU head</text><text x="985" y="368">linear output</text></g>
<g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M192 354 H224"/><path d="M426 354 H458"/><path d="M708 354 H740"/><path d="M872 354 H904"/></g>
<text x="540" y="446" fill="#6d28d9" font-size="19" font-weight="700">LARGE · 17,858,049 parameters · 19 Linear layers</text>
<rect x="140" y="477" width="800" height="72" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
<text x="540" y="506" fill="#065f46" font-size="17">Residual block: output = ReLU(h + Linear₂(ReLU(Linear₁(h))))</text>
<text x="540" y="532" fill="#334155" font-size="15">A skip connection keeps the incoming representation available while learning a correction.</text>
</g></svg>
